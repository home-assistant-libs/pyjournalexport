[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "pyjournalexport"
description = "Incremental parser for the systemd journal export format"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "The Home Assistant Authors", email = "hello@home-assistant.io" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: System :: Logging",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/home-assistant-libs/pyjournalexport"
Issues = "https://github.com/home-assistant-libs/pyjournalexport/issues"

[dependency-groups]
dev = [
  "maturin>=1.9,<2",
  "mypy==1.19.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.maturin]
python-source = "python"
module-name = "pyjournalexport._parser"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "PYI021", "S101"]

[tool.ruff.lint.per-file-ignores]
"benches/*" = ["E501", "INP001", "T201"]
"tests/*" = ["E501", "INP001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["python", "tests"]
